<div class="container">
  <h2>Calificaciones de Alumnos</h2>

  <table mat-table [dataSource]="notas" class="mat-elevation-z8">
    <!-- Alumno Column -->
    <ng-container matColumnDef="alumno">
      <th mat-header-cell *matHeaderCellDef>Alumno</th>
      <td mat-cell *matCellDef="let nota">{{nota.nombreAlumno}}</td>
    </ng-container>

    <!-- Curso Column -->
    <ng-container matColumnDef="curso">
      <th mat-header-cell *matHeaderCellDef>Curso</th>
      <td mat-cell *matCellDef="let nota">{{nota.nombreCurso}}</td>
    </ng-container>

    <!-- Calificación Column -->
    <ng-container matColumnDef="calificacion">
      <th mat-header-cell *matHeaderCellDef>Calificación</th>
      <td mat-cell *matCellDef="let nota">
        <ng-container *ngIf="notaSeleccionada !== nota; else editarNota">
          <span [class]="'nota-' + getColorNota(nota.calificacion)">
            {{nota.calificacion !== null ? nota.calificacion.toFixed(1) : 'Sin calificar'}}
          </span>
          <button mat-icon-button (click)="seleccionarNota(nota)">
            <mat-icon>edit</mat-icon>
          </button>
        </ng-container>
        <ng-template #editarNota>
          <mat-form-field appearance="outline" class="nota-input">
            <input matInput type="number" [(ngModel)]="nuevaNota" min="0" max="5" step="0.1">
          </mat-form-field>
          <button mat-icon-button color="primary" (click)="guardarNota()">
            <mat-icon>check</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="cancelarEdicion()">
            <mat-icon>close</mat-icon>
          </button>
        </ng-template>
      </td>
    </ng-container>

    <!-- Estado Column -->
    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let nota">
        <span [class]="'estado-' + getColorNota(nota.calificacion)">
          {{nota.estado}}
        </span>
      </td>
    </ng-container>

    <!-- Acciones Column -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let nota">
        <button mat-icon-button color="primary" (click)="seleccionarNota(nota)" *ngIf="notaSeleccionada !== nota">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<style>
  .container {
    padding: 20px;
  }

  table {
    width: 100%;
  }

  .nota-input {
    width: 100px;
    margin-right: 10px;
  }

  .nota-aprobado {
    color: #4CAF50;
    font-weight: bold;
  }

  .nota-reprobado {
    color: #f44336;
    font-weight: bold;
  }

  .nota-pendiente {
    color: #9e9e9e;
    font-style: italic;
  }

  .estado-aprobado {
    color: #4CAF50;
    font-weight: bold;
  }

  .estado-reprobado {
    color: #f44336;
    font-weight: bold;
  }

  .estado-pendiente {
    color: #9e9e9e;
    font-style: italic;
  }
</style>
