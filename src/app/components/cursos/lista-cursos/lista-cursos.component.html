<div class="container">
  <h2>Lista de Cursos</h2>
  
  <button mat-raised-button color="primary" class="add-button" routerLink="/cursos/nuevo">
    <mat-icon>add</mat-icon>
    Agregar Curso
  </button>

  <table mat-table [dataSource]="cursos" class="mat-elevation-z8">
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let curso">{{curso.id}}</td>
    </ng-container>

    <!-- Nombre Column -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let curso">{{curso.nombre}}</td>
    </ng-container>

    <!-- Descripción Column -->
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let curso">{{curso.descripcion}}</td>
    </ng-container>

    <!-- Profesor Column -->
    <ng-container matColumnDef="profesor">
      <th mat-header-cell *matHeaderCellDef>Profesor</th>
      <td mat-cell *matCellDef="let curso">{{curso.profesor}}</td>
    </ng-container>

    <!-- Duración Column -->
    <ng-container matColumnDef="duracion">
      <th mat-header-cell *matHeaderCellDef>Duración (horas)</th>
      <td mat-cell *matCellDef="let curso">{{curso.duracion}}</td>
    </ng-container>

    <!-- Cupos Column -->
    <ng-container matColumnDef="cupos">
      <th mat-header-cell *matHeaderCellDef>Cupos</th>
      <td mat-cell *matCellDef="let curso">
        <div class="cupos-info">
          <span>Disponibles: {{curso.cuposDisponibles}}</span>
          <span>Inscritos: {{curso.alumnosInscritos}}</span>
          <span>Total: {{curso.cupo}}</span>
        </div>
      </td>
    </ng-container>

    <!-- Acciones Column -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let curso">
        <button mat-icon-button color="primary" (click)="verAlumnos(curso)" matTooltip="Ver Alumnos">
          <mat-icon>people</mat-icon>
        </button>
        <button mat-icon-button color="accent" (click)="editarCurso(curso)" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminarCurso(curso)" matTooltip="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<style>
.cupos-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cupos-info span {
  font-size: 14px;
}

.mat-column-cupos {
  min-width: 120px;
}
</style>
